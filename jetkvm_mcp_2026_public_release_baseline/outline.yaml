topic: "Evidence-backed 2026 public-release baseline for BenDManning/jetkvm-mcp"
research_date: "2026-08-15"
expected_baseline_commit: "176ec421f9ee6c801517180e1ad0ec9c84570e8e"
exact_baseline_commit: "6e52f0027b13f928b768de0feeab4847ef9ca53e"
exact_baseline_tree: "34e8b4451d76821950c23d7c06958d021700f3a7"
later_head_observation: >-
  During batch 2, local HEAD and origin/main moved to
  71445bc6bf2325e6c683e362393605089c336b63 (the merged form of the cleanup
  change). Its Git tree is exactly 34e8b4451d76821950c23d7c06958d021700f3a7,
  byte-identical to the tree studied at 6e52f00. Research remains keyed to the
  initially recorded commit and shared tree; the later commit identity is
  recorded for provenance rather than treated as a different implementation.
baseline_note: >-
  The current local HEAD differs from the expected baseline by commit 6e52f00
  (cleanup: remove custom CI policy). The working tree also contained the
  pre-existing untracked paths .agents/ and skills-lock.json before research
  artifacts were created. Research must describe the exact current tree and
  must not silently mix evidence from the expected revision.
items:
  - id: 1
    name: "Go toolchain, modules, dependencies, and vulnerability management"
    description: >-
      Current Go support and minimum-version policy, toolchain reproducibility,
      module integrity, dependency risk and updates, vulnerability coverage,
      licenses, and analyzer/tool pin management applied to this repository.
  - id: 2
    name: "Go architecture, package boundaries, and public API design"
    description: >-
      Repository structure, responsibilities, interfaces, dependency direction,
      configuration and provider boundaries, test seams, commands, typed results,
      and proportional complexity for a small single-maintainer server.
  - id: 3
    name: "Correctness, concurrency, cancellation, errors, and resource lifecycles"
    description: >-
      Contexts, deadlines, goroutine and channel ownership, WebRTC, pending RPCs,
      subprocesses, files and pipes, cleanup, shutdown, partial failures, errors,
      retry classification, ambiguous outcomes, and leak detection.
  - id: 4
    name: "Testing, verification, qualification, and performance evidence"
    description: >-
      Unit, integration, race, fuzz, property, conformance, subprocess, malformed
      input, cancellation, leak, cross-platform, container, hardware, soak, and
      performance evidence, with claim boundaries kept explicit.
  - id: 5
    name: "MCP specification, Go SDK, compatibility, and conformance"
    description: >-
      Current MCP specification and official Go SDK through the research date,
      including lifecycle, tools, content, errors, annotations, list metadata,
      transports, stateless operation, negotiation, conformance, and advisories.
  - id: 6
    name: "MCP tool-surface design, consequence communication, and compatibility burden"
    description: >-
      Tool names, descriptions, schemas, bounds, annotations, consequences,
      structured results and errors, compatibility, deprecation, SemVer, caller
      comprehension, and whether each tool earns its permanent burden.
  - id: 7
    name: "MCP transports, authentication, authorization, and deployment boundaries"
    description: >-
      Stdio trust and Streamable HTTP security, bearer handling, Host/Origin,
      DNS rebinding, TLS and proxies, binding defaults, CORS, limits, timeouts,
      isolation, OAuth applicability, token risks, and deployment boundaries.
  - id: 8
    name: "Agentic-AI and MCP-specific threat landscape"
    description: >-
      Concrete repository attack paths for injection, poisoning, shadowing,
      rug pulls, malicious metadata/clients, confused deputies, schema changes,
      unsafe retries, exfiltration, result poisoning, and multi-server confusion.
  - id: 9
    name: "JetKVM, WebRTC, FFmpeg, HID, power, wake, upload, and virtual-media boundaries"
    description: >-
      Device protocol/session behavior, WebRTC and media parsing, FFmpeg process
      hardening, local files and uploads, appliance URL fetch/SSRF, HID payloads,
      physical consequences, and defensible compatibility claims.
  - id: 10
    name: "Privacy, logging, diagnostics, telemetry, and incident evidence"
    description: >-
      Sensitive data handling, minimization, redaction, retention, observability,
      cardinality, auditability, and incident reconstruction without creating a
      sensitive request log or second operational control plane.
  - id: 11
    name: "AI-assisted development and untrusted contribution security"
    description: >-
      Generated code and PR risks, malicious instructions and issue text,
      dependency/API/test/provenance risks, secret exposure, review overload,
      agent authority, and practical one-maintainer verification controls.
  - id: 12
    name: "GitHub repository governance, maintainer security, and public-project readiness"
    description: >-
      Live rules and settings, branch/review/tag controls, reporting and response,
      contributor/support/spam posture, release ownership, account security,
      plan constraints, adoption stages, and process-theater rejection.
  - id: 13
    name: "GitHub Actions and CI/CD security, reliability, and reproducibility"
    description: >-
      Permissions, immutable action pinning, triggers and injection, forks,
      caches/artifacts/logs/runners/installers, tool versions, timeouts, matrices,
      cancellation, concurrency, and product-claim-driven branch gates.
  - id: 14
    name: "Releases, containers, SBOMs, signing, provenance, and software supply chain"
    description: >-
      GoReleaser and release automation, integrity, signatures, attestations,
      provenance, SBOM/VEX, reproducibility, container hardening and publication,
      FFmpeg provenance, verification, rollback, and compromise response.
  - id: 15
    name: "Framework mapping and pragmatic one-maintainer operating model"
    description: >-
      Proportional mapping of applicable OpenSSF, OSPS, Scorecard, SLSA, SSDF,
      CISA, OWASP, MCP Security, and AAIF guidance into a staged operating model
      and the five-to-ten highest-value changes.
execution:
  batch_size: 3
  items_per_agent: 1
  output_dir: "<local-worktree>/jetkvm_mcp_2026_public_release_baseline/results"
  source_preference: "Primary and authoritative sources; repository evidence first"
  date_range: "Canonical current material, emphasizing 2024-01-01 through 2026-08-15"
  language: "English"
