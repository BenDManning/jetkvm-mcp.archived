field_categories:
  - category: identity_and_scope
    description: "Identify the workstream, its exact question, repository scope, and adoption stage."
    fields:
      - {name: item_name, description: "Exact primary research-item name.", detail_level: brief, required: true}
      - {name: research_question, description: "Decision-oriented question answered for this repository.", detail_level: detailed, required: true}
      - {name: scope, description: "Included and excluded concerns and relevant trust boundaries.", detail_level: detailed, required: true}
      - {name: repository_surfaces, description: "Exact repository paths, packages, symbols, tests, jobs, settings, issues, PRs, or releases examined.", detail_level: detailed, required: true}
      - {name: applicability_stage, description: "One or more of current_private, before_public_release, after_external_adoption, future_only, or not_applicable.", detail_level: brief, required: true}
  - category: sources_and_authority
    description: "Register sources with authority, dates, versions, status, freshness, disagreements, and limitations."
    fields:
      - {name: authoritative_sources, description: "List of title, publisher, URL, publication/update date, version/revision, access date, and supported claims for every authoritative source.", detail_level: detailed, required: true}
      - {name: source_class, description: "For each source: repository_evidence, normative_specification, official_documentation, official_advisory, security_framework, peer_reviewed_research, maintainer_case_study, or secondary_commentary.", detail_level: detailed, required: true}
      - {name: normative_status, description: "For each cited proposition: MUST, SHOULD, MAY, guidance, observation, or opinion.", detail_level: detailed, required: true}
      - {name: freshness_and_supersession, description: "Whether material is current as of 2026-08-15 and what it supersedes or is superseded by.", detail_level: detailed, required: true}
      - {name: source_disagreements, description: "Contradictions among authoritative sources and a reasoned resolution.", detail_level: detailed, required: true}
      - {name: source_limitations, description: "Coverage, access, evidence, generalizability, plan, version, or publication-date limits.", detail_level: detailed, required: true}
  - category: repository_evidence
    description: "Tie claims to the exact studied revision and distinguish implementation from documentation."
    fields:
      - {name: exact_baseline_commit, description: "Exact studied HEAD is 6e52f0027b13f928b768de0feeab4847ef9ca53e; note expected-baseline divergence and pre-existing untracked files.", detail_level: brief, required: true}
      - {name: current_repository_evidence, description: "Exact files, lines or symbols, packages, tests, jobs, configuration, documentation, live settings, issues, PRs, and releases supporting the finding.", detail_level: detailed, required: true}
      - {name: implementation_and_documentation_agreement, description: "Where executable behavior and claims agree, conflict, or cannot be verified.", detail_level: detailed, required: true}
      - {name: current_state, description: "One of satisfied, substantially_satisfied, partial, gap, unknown, or not_applicable, with justification.", detail_level: moderate, required: true}
      - {name: evidence_missing, description: "Unavailable settings, runtime, hardware, soak, incident, user, release, or other evidence needed.", detail_level: detailed, required: true}
  - category: risk_and_analysis
    description: "Explain concrete repository-specific failures, controls, residual risk, and proportional effects."
    fields:
      - {name: concrete_threat_or_failure_scenarios, description: "Plausible attack or failure paths tied to actual architecture; no generic lists.", detail_level: detailed, required: true}
      - {name: affected_assets_and_trust_boundaries, description: "Affected credentials, device or host control, media or data, artifacts, source, maintainer authority, and crossed boundaries.", detail_level: detailed, required: true}
      - {name: plausible_impact, description: "Safety, security, reliability, privacy, compatibility, release, or maintainer impact.", detail_level: detailed, required: true}
      - {name: likelihood_or_preconditions, description: "Required access, deployment, timing, versions, behavior, and realistic likelihood qualifiers.", detail_level: detailed, required: true}
      - {name: existing_controls, description: "Verified controls present in code, tests, configuration, workflows, settings, or operational boundary.", detail_level: detailed, required: true}
      - {name: residual_risk, description: "Risk remaining after verified controls and why it matters or is accepted.", detail_level: detailed, required: true}
      - {name: compatibility_or_SemVer_effect, description: "Effect on pre-1.0 compatibility, MCP callers, configuration, deployment, or release semantics.", detail_level: moderate, required: true}
      - {name: privacy_effect, description: "Effect on collection, exposure, retention, redaction, or sensitive-data handling.", detail_level: moderate, required: true}
      - {name: operational_effect, description: "Effect on deployment, diagnosis, releases, CI time, availability, or incident response.", detail_level: moderate, required: true}
      - {name: maintainer_effect, description: "Cognitive load, review burden, recurring work, required expertise, and automation value for one maintainer.", detail_level: detailed, required: true}
  - category: decision
    description: "Make a proportional, staged, acceptance-testable repository decision."
    fields:
      - {name: disposition, description: "One of retain, simplify, change, add, defer, monitor, or reject.", detail_level: brief, required: true}
      - {name: recommendation, description: "Concrete decision applied to this repository, with retained strengths and boundaries.", detail_level: detailed, required: true}
      - {name: minimal_practical_change, description: "Smallest control or clarification that materially addresses the failure mode.", detail_level: detailed, required: true}
      - {name: optional_stronger_control, description: "Higher-assurance option and when its added burden becomes justified.", detail_level: detailed, required: true}
      - {name: rejected_or_overengineered_alternatives, description: "Specific disproportionate controls and why they should not be adopted now.", detail_level: detailed, required: true}
      - {name: rationale, description: "Repository evidence, failure mode, proportionality, and source reasoning connecting analysis to decision.", detail_level: detailed, required: true}
      - {name: dependencies_or_prerequisites, description: "Required decisions, settings, plan features, tests, upstream changes, hardware, or release conditions.", detail_level: detailed, required: true}
      - {name: migration_or_rollout_considerations, description: "Safe staging, compatibility, fallback, communication, and evidence capture.", detail_level: detailed, required: true}
      - {name: priority, description: "P0, P1, P2, P3, or no_action, justified relative to public release.", detail_level: brief, required: true}
      - {name: implementation_effort, description: "XS, S, M, L, or XL with the assumed scope.", detail_level: brief, required: true}
      - {name: ongoing_maintenance_burden, description: "low, medium, or high with recurring tasks identified.", detail_level: brief, required: true}
      - {name: confidence, description: "high, medium, or low based on evidence quality and remaining unknowns.", detail_level: brief, required: true}
  - category: verification
    description: "Define evidence required to accept, challenge, and revisit the decision or support claim."
    fields:
      - {name: acceptance_evidence, description: "Objective artifacts, settings, behavior, tests, or review evidence proving completion.", detail_level: detailed, required: true}
      - {name: proposed_tests_or_checks, description: "Focused automated, manual, review, or operational verification proportional to the claim.", detail_level: detailed, required: true}
      - {name: negative_or_abuse_cases, description: "Failure, malicious, malformed, timeout, race, compromise, and boundary cases to exercise.", detail_level: detailed, required: true}
      - {name: evidence_needed_before_claiming_support, description: "Evidence needed before making protocol, device, platform, security, performance, or qualification claims.", detail_level: detailed, required: true}
      - {name: revisit_trigger, description: "Upstream release or advisory, adoption, contributor volume, incident, plan change, architecture change, or time-based trigger.", detail_level: detailed, required: true}
      - {name: unresolved_questions, description: "Questions requiring maintainer choice, unavailable live state, hardware, experiment, or upstream clarification.", detail_level: detailed, required: true}
      - {name: uncertain, description: "Reserved array of field names whose values remain uncertain; uncertain values must also be marked [uncertain]. The bundled validator intentionally excludes this bookkeeping key from coverage, so the key remains mandatory in result output but is not a validator-required research field.", detail_level: brief, required: false}
