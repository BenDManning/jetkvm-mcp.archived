version: 2
project_name: jetkvm-mcp

builds:
  - id: jetkvm-mcp
    main: ./cmd/jetkvm-mcp
    binary: jetkvm-mcp
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: binaries
    ids:
      - jetkvm-mcp
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - THIRD_PARTY_NOTICES.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

sboms:
  - id: archive
    artifacts: archive
    ids:
      - binaries
    documents:
      - "{{ .ArtifactName }}.spdx.json"
    args:
      - $artifact
      - --output
      - spdx-json=$document

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
