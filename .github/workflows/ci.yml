name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
          cache: true
      - name: Verify gofmt
        run: make format
      - name: Verify go mod tidy
        run: make tidy
      - name: Verify module checksums
        run: make module-verify
      - name: Test with race detector
        run: make race
      - name: Vet
        run: make vet
      - name: Staticcheck
        run: make staticcheck
      - name: Vulnerability analysis
        run: make govulncheck
      - name: Bounded fuzz smoke
        run: make fuzz-smoke
      - name: Produce coverage evidence
        run: make coverage COVERAGE_DIR="${RUNNER_TEMP}/coverage"
      - name: Upload coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: ${{ runner.temp }}/coverage
          if-no-files-found: warn
      - name: Verify release targets
        run: make verify
  minimum-go:
    name: Minimum Go 1.25
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.0'
          cache: true
      - run: go version
      - run: make ci-minimum
  protocol-gates:
    name: MCP protocol gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
      - name: Build server
        run: go build -trimpath -o "${RUNNER_TEMP}/jetkvm-mcp" ./cmd/jetkvm-mcp
      - name: Run pinned conformance and Inspector gates
        run: >-
          make protocol-gates
          MCP_GATE_SERVER="${RUNNER_TEMP}/jetkvm-mcp"
          MCP_GATE_DIR="${RUNNER_TEMP}/mcp-gate-artifacts"
      - name: Upload MCP gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-protocol-gates
          path: ${{ runner.temp }}/mcp-gate-artifacts
          if-no-files-found: warn
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Verify container binary architectures
        run: >-
          make container-verify
          CONTAINER_AMD64_DIR="${RUNNER_TEMP}/container-amd64"
          CONTAINER_ARM64_DIR="${RUNNER_TEMP}/container-arm64"
