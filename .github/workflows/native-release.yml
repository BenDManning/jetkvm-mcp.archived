name: Native release rehearsal

on:
  workflow_call:
    inputs:
      release_ref:
        description: Exact protected version tag ref supplied by the integrated release workflow
        required: true
        type: string
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-rehearsal:
    name: Native release rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_IDENTITY_REF: ${{ inputs.release_ref || github.ref }}
      RELEASE_IDENTITY_TRIGGER: ${{ inputs.release_ref && 'push' || 'workflow_dispatch' }}
      REUSABLE_RELEASE_REF: ${{ inputs.release_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache: true
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3-68@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64
      - name: Enforce rehearsal and protected-tag invocation boundaries
        run: |
          set -euo pipefail
          if [[ -n ${REUSABLE_RELEASE_REF} ]]; then
            [[ ${REUSABLE_RELEASE_REF} =~ ^refs/tags/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          else
            [[ ${GITHUB_REF} == refs/heads/main ]]
          fi
          [[ ${GITHUB_REF} == ${RELEASE_IDENTITY_REF} ]]
      - name: Build and verify native subjects without publishing
        run: make release-snapshot RELEASE_VERIFY_ARM64=1
      - name: Keylessly sign and verify the checksum manifest
        run: |
          set -euo pipefail
          cosign_path=$(GOTOOLCHAIN=go1.26.6 go -C tools tool -n cosign)
          PATH="$(dirname "$cosign_path"):${PATH}"
          cosign sign-blob --yes --bundle dist/checksums.txt.sigstore.json dist/checksums.txt
          cosign verify-blob \
            --bundle dist/checksums.txt.sigstore.json \
            --certificate-identity https://github.com/${GITHUB_REPOSITORY}/.github/workflows/native-release.yml@${RELEASE_IDENTITY_REF} \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-github-workflow-repository ${GITHUB_REPOSITORY} \
            --certificate-github-workflow-ref ${RELEASE_IDENTITY_REF} \
            --certificate-github-workflow-sha ${GITHUB_SHA} \
            --certificate-github-workflow-trigger ${RELEASE_IDENTITY_TRIGGER} \
            dist/checksums.txt
      - name: Generate hosted provenance for every checksummed subject
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
      - name: Verify hosted provenance subjects and identity
        run: |
          set -euo pipefail
          cp "${{ steps.provenance.outputs.bundle-path }}" dist/provenance.sigstore.json
          while read -r _ subject; do
            gh attestation verify "dist/${subject}" \
              --repo ${GITHUB_REPOSITORY} \
              --bundle dist/provenance.sigstore.json \
              --cert-identity https://github.com/${GITHUB_REPOSITORY}/.github/workflows/native-release.yml@${RELEASE_IDENTITY_REF} \
              --signer-workflow ${GITHUB_REPOSITORY}/.github/workflows/native-release.yml \
              --source-ref ${RELEASE_IDENTITY_REF} \
              --source-digest ${GITHUB_SHA} \
              --deny-self-hosted-runners
          done < dist/checksums.txt
      - name: Retain consumer-verifiable rehearsal evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-release-rehearsal-${{ github.sha }}
          path: |
            dist/*.tar.gz
            dist/*.spdx.json
            dist/checksums.txt
            dist/checksums.txt.sigstore.json
            dist/provenance.sigstore.json
          if-no-files-found: error
          retention-days: 30
