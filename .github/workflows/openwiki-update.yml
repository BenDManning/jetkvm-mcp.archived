name: OpenWiki Update

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "openwiki/**"
      - "AGENTS.md"
      - "CLAUDE.md"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: openwiki-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: openwiki-local

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"

      - name: Configure npm install directory
        run: |
          echo "NPM_CONFIG_PREFIX=${RUNNER_TEMP}/npm-global" >> "${GITHUB_ENV}"
          echo "NPM_CONFIG_CACHE=${RUNNER_TEMP}/npm-cache" >> "${GITHUB_ENV}"
          echo "npm_config_cache=${RUNNER_TEMP}/npm-cache" >> "${GITHUB_ENV}"
          echo "npm_config_devdir=${RUNNER_TEMP}/node-gyp" >> "${GITHUB_ENV}"
          echo "XDG_CACHE_HOME=${RUNNER_TEMP}/xdg-cache" >> "${GITHUB_ENV}"
          echo "GIT_CONFIG_GLOBAL=${RUNNER_TEMP}/gitconfig" >> "${GITHUB_ENV}"
          echo "${RUNNER_TEMP}/npm-global/bin" >> "${GITHUB_PATH}"

      - name: Install OpenWiki
        run: npm install --global openwiki@0.3.3 mermaid@11.16.0 jsdom@29.1.1

      - name: Update OpenWiki
        run: openwiki code --update --print
        env:
          OPENWIKI_TELEMETRY_DISABLED: "1"
          DO_NOT_TRACK: "1"
          OPENWIKI_PROVIDER: openai-chatgpt
          OPENWIKI_MODEL_ID: "gpt-5.6-terra"

      - name: Preserve repository-specific agent guidance
        run: git restore --source=HEAD -- AGENTS.md CLAUDE.md

      - name: Create OpenWiki update pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          add-paths: |
            openwiki
            AGENTS.md
            CLAUDE.md
          branch: openwiki/update
          commit-message: "docs: update OpenWiki"
          title: "docs: update OpenWiki"
          body: |
            Automated OpenWiki documentation update for changes merged to main.
